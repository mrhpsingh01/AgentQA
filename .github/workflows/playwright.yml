name: AgentQA Self-Healing CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Playwright Tests with Self-Healing
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: runner/package.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Start AgentQA Backend Service
        run: |
          cd backend
          pip install uv
          uv pip install --system -r <(python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              d = tomllib.load(f)
          for dep in d['project']['dependencies']:
              print(dep)
          ") || pip install fastapi uvicorn pydantic pydantic-settings sqlalchemy asyncpg aiosqlite pyjwt pwdlib httpx structlog jinja2 beautifulsoup4
          nohup uvicorn src.main:app --port 8000 > backend.log 2>&1 &
          sleep 3
          curl -f http://localhost:8000/healthz

      - name: Install Runner Dependencies
        run: |
          cd runner
          npm ci
          npx playwright install chromium --with-deps

      - name: Run Playwright Suite
        run: |
          cd runner
          npm test
        env:
          CI: true
          AGENTQA_BACKEND_URL: http://localhost:8000

      - name: Upload Test Report & Healing Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentqa-execution-report
          path: |
            runner/playwright-report/
            backend/agentqa.db
          retention-days: 14
