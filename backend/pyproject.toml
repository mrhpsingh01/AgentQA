[project]
name = "agentqa-backend"
version = "0.1.0"
description = "AgentQA AI Web QA Platform - FastAPI Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.143.2",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    # EmailStr (auth schemas) needs this at import time; pydantic does not install it on its own.
    "email-validator==2.3.0",
    "sqlalchemy[asyncio]==2.1.4",
    "asyncpg==0.32.0",
    "aiosqlite==0.22.1",
    "alembic==1.20.0",
    "pyjwt==2.15.1",
    "pwdlib[argon2]==0.3.1",
    "redis[hiredis]==8.1.0",
    "websockets==17.2",
    "httpx==0.28.1",
    "structlog==26.1.0",
    "jinja2==3.1.6",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.3",
    # Background jobs (docker-compose `worker` service runs `taskiq worker src.tasks.broker:broker`).
    "taskiq==0.13.0",
    "taskiq-redis==1.2.4",
    # Terminal output of demo.py and scripts/run_benchmark.py.
    "rich==15.0.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.1",
    "mypy==2.4.0"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# `src` (the backend package) and `scripts` (repo-level tooling) are importable from the tests.
pythonpath = [".", "../scripts"]
