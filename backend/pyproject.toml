[project]
name = "agentqa-backend"
version = "0.1.0"
description = "AgentQA AI Web QA Platform - FastAPI Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "pyjwt>=2.9.0",
    "pwdlib[argon2]>=0.2.1",
    "redis[hiredis]>=5.2.0",
    "websockets>=13.1",
    "httpx>=0.27.2",
    "structlog>=24.4.0",
    "jinja2>=3.1.4",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0"
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
