services:
  postgres:
    image: postgres:16-alpine
    container_name: agentqa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentqa_user
      POSTGRES_PASSWORD: agentqa_password
      POSTGRES_DB: agentqa_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentqa_user -d agentqa_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agentqa-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: agentqa-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://agentqa_user:agentqa_password@postgres:5432/agentqa_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=dev-secret-key-change-in-production-super-secure-token
      - ENVIRONMENT=development
    volumes:
      - ./backend:/app
      - ./shared:/app/shared:ro
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: agentqa-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://agentqa_user:agentqa_password@postgres:5432/agentqa_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=dev-secret-key-change-in-production-super-secure-token
      - ENVIRONMENT=development
    volumes:
      - ./backend:/app
      - ./shared:/app/shared:ro
    command: ["taskiq", "worker", "src.tasks.broker:broker"]

volumes:
  pgdata:
  redisdata:
